<svg xmlns="http://www.w3.org/2000/svg"
     width="920"
     height="190"
     viewBox="0 0 920 190">

<defs>

    <!-- Subtle glow -->
    <filter id="glow">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Soft background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0d1117"/>
        <stop offset="100%" stop-color="#101820"/>
    </linearGradient>

</defs>


<!-- BACKGROUND -->

<rect
    x="0"
    y="0"
    width="920"
    height="190"
    rx="14"
    fill="url(#bg)"
    stroke="#21262d"
    stroke-width="1"/>



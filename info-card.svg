<svg xmlns="http://www.w3.org/2000/svg"
width="620"
height="500">

<style>

text {
    font-family: Consolas, monospace;
}

.value {
    fill:#58a6ff;
}

.key {
    fill:#7ee787;
}

.row {
    opacity:0;
}

@keyframes fade {
    to { opacity:1; }
}

</style>

<!-- Background -->
<rect
x="0"
y="0"
width="620"
height="500"
rx="12"
fill="#0d1117"/>

<!-- Terminal Header -->
<rect
x="0"
y="0"
width="620"
height="38"
rx="12"
fill="#161b22"/>

<!-- Terminal Buttons -->
<circle cx="22" cy="19" r="6" fill="#ff5f56"/>
<circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="19" r="6" fill="#27c93f"/>

<!-- Terminal Title -->
<text
x="310"
y="24"
fill="#c9d1d9"
font-size="14"
text-anchor="middle">
whoami
</text>


<!-- NAME -->
<g class="row">
<animate attributeName="opacity"
from="0" to="1"
dur=".3s"
begin="0s"
fill="freeze"/>

<text class="key" x="25" y="68" font-size="15">Name</text>

<text class="value" x="190" y="68" font-size="15">
Smitha U M
</text>
</g>


